name: Build

on:
  push:
    branches: [ "main", "beta" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/uptriva-agent-linux ./cmd/
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/uptriva-agent.exe ./cmd/
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/uptriva-agent-darwin ./cmd/
