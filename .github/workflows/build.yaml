name: Build

on:
  push:
    branches: [ "main", "beta" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

      - name: Setup Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
        with:
          go-version: '1.25.5'

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/uptriva-agent-linux ./cmd/
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/uptriva-agent.exe ./cmd/
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/uptriva-agent-darwin ./cmd/
