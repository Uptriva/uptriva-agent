name: Build and Push Uptime Agent

on:
  push:
    branches: [ "main" ]

jobs:
  build-uptime-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

      - name: Setup Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4
        with:
          go-version: '1.25.5'

      - name: Read Version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Static Agents for Multi-Platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/linux/amd64 dist/linux/arm64 dist/windows/amd64 dist/darwin/amd64 dist/darwin/arm64
          LDFLAGS="-s -w -X main.releasePublicKeyHex=${{ secrets.AGENT_RELEASE_PUBKEY }} -X main.AgentVersion=${VERSION}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/linux/amd64/shxrk-agent ./cmd/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/linux/arm64/shxrk-agent ./cmd/
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/windows/amd64/shxrk-agent.exe ./cmd/
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/darwin/amd64/shxrk-agent ./cmd/
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/darwin/arm64/shxrk-agent ./cmd/
          cp dist/linux/amd64/shxrk-agent dist/linux/amd64/uptime-agent
          cp dist/linux/arm64/shxrk-agent dist/linux/arm64/uptime-agent
          cp dist/windows/amd64/shxrk-agent.exe dist/windows/amd64/uptime-agent.exe
          cp dist/darwin/amd64/shxrk-agent dist/darwin/amd64/uptime-agent
          cp dist/darwin/arm64/shxrk-agent dist/darwin/arm64/uptime-agent

      - name: Generate Checksums and Metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$VERSION" > dist/version
          echo "$VERSION" > dist/min_agent_version
          if [ -f privacy_policy_version ]; then
            cp privacy_policy_version dist/privacy_policy_version
          else
            echo "1.0.0" > dist/privacy_policy_version
          fi
          if [ -f release_notes.md ]; then
            cp release_notes.md dist/release_notes.md
          fi
          if [ -f requires_consent ]; then
            touch dist/requires_consent
          fi

      - name: Compress and Upload to Download Server
        env:
          DOWNLOAD_API_KEY: ${{ secrets.DOWNLOAD_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -czf release.tar.gz -C dist .
          curl -X POST https://download.shxrk.systems/upload \
            -H "Authorization: Bearer $DOWNLOAD_API_KEY" \
            -F "file=@release.tar.gz" \
            --fail --show-error --silent
