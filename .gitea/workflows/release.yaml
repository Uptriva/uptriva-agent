name: Build and Push Uptime Agent

on:
  push:
    branches: [ "main" ]

jobs:
  build-uptime-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.5'

      - name: Build Static Agents for Multi-Platforms
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/uptime-agent-linux-amd64 cmd/main.go cmd/metrics_linux.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/uptime-agent-linux-arm64 cmd/main.go cmd/metrics_linux.go
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -ldflags="-s -w" -o dist/uptime-agent-freebsd-amd64 cmd/main.go cmd/metrics_freebsd.go
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/uptime-agent-windows-amd64.exe cmd/main.go cmd/metrics_windows.go
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/uptime-agent-darwin-amd64 cmd/main.go cmd/metrics_darwin.go
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/uptime-agent-darwin-arm64 cmd/main.go cmd/metrics_darwin.go

      - name: Upload Multi-Platform Agent Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: uptime-agents-multiplatform
          path: dist/
