name: Build and Push Uptime Agent

on:
  push:
    branches: [ "main" ]

jobs:
  build-uptime-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.5'

      - name: Build Static Agents for Multi-Platforms
        run: |
          mkdir -p dist/linux/amd64 dist/linux/arm64 dist/windows/amd64 dist/darwin/amd64 dist/darwin/arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/linux/amd64/uptime-agent cmd/main.go cmd/metrics.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/linux/arm64/uptime-agent cmd/main.go cmd/metrics.go
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/windows/amd64/uptime-agent.exe cmd/main.go cmd/metrics.go
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/darwin/amd64/uptime-agent cmd/main.go cmd/metrics.go
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/darwin/arm64/uptime-agent cmd/main.go cmd/metrics.go

      - name: Compress and Upload to Download Server
        env:
          DOWNLOAD_API_KEY: ${{ secrets.DOWNLOAD_API_KEY }}
        run: |
          cd dist
          tar -czf ../release.tar.gz .
          cd ..
          curl -X POST https://download.shxrk.systems/upload \
            -H "Authorization: Bearer $DOWNLOAD_API_KEY" \
            -F "file=@release.tar.gz" \
            --fail --show-error --silent
